name: Windows Admin
on:
  workflow_dispatch:
  push:
    tags: ['admin-v*']
    branches: ['codex/static-export']
    paths:
      - 'apps/admin/**'
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/engine/**'
      - 'scripts/*admin*'
      - 'tests/test_admin.py'
      - 'tests/fixtures/maintainer-release.jsonl.gz'
      - 'pyproject.toml'
      - 'requirements.lock'
      - '.github/workflows/windows-admin.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m pytest -q tests/test_admin.py
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: python scripts/build_admin_preview.py
      - run: python scripts/package_admin.py
      - run: python scripts/smoke_admin_package.py "dist/Lazuri Admin/Lazuri Admin.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Lazuri-Admin-Windows
          path: dist/Lazuri Admin/
          retention-days: 30
