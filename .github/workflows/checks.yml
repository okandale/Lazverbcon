name: Checks
on: [push, pull_request]
jobs:
  engine-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check packages/engine/src/laz_engine apps/api/src apps/admin/src scripts tests
      - run: ruff format --check packages/engine/src/laz_engine apps/api/src apps/admin/src scripts tests
      - run: pytest -q
      - run: lazcon openapi --output /tmp/openapi.json
      - run: diff -u apps/web/openapi.json /tmp/openapi.json
      - run: lazcon build --profile core --output artifacts/core.sqlite
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm test
      - run: pnpm build
  static-export-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pnpm --dir apps/web install --frozen-lockfile
      # Small shards deliberately exercise suggestions across file boundaries.
      - run: python scripts/static_test_cases.py artifacts/static-test
      - run: python scripts/admin_static_test_cases.py artifacts/admin-static-test
      - run: pnpm --dir apps/web exec vitest run src/api/editorial.integration.test.mjs
        env:
          LAZ_ADMIN_STATIC_TEST_DIR: ../../artifacts/admin-static-test
      - run: pnpm --dir apps/web exec vitest run src/api/static.integration.test.mjs
        env:
          LAZ_STATIC_TEST_DIR: ../../artifacts/static-test
      # Disposable generated catalogs test engine/export parity; they never
      # update the admin master or become a published website release.
      - run: lazcon build --output artifacts/release.sqlite
      - run: lazcon export-static --database artifacts/release.sqlite --output artifacts/static-data
      - run: python scripts/verify_static.py artifacts/static-data artifacts/release.sqlite
      - run: python scripts/static_test_cases.py artifacts/static-full-test --database artifacts/release.sqlite
      - run: pnpm --dir apps/web exec vitest run src/api/static.integration.test.mjs
        env:
          LAZ_STATIC_TEST_DIR: ../../artifacts/static-full-test
          LAZ_STATIC_DATA: ../../artifacts/static-data
      - run: python scripts/build_static.py --data artifacts/static-data --output artifacts/pages
