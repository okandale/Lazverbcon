[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lazverbcon"
version = "0.1.0"
description = "A reproducible Laz conjugation engine, API, and SQLite publisher"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
lazcon = "laz_api.cli:main"
lazadmin = "laz_admin.launcher:main"

[tool.setuptools.packages.find]
where = ["packages/engine/src", "apps/api/src", "apps/admin/src"]

[tool.setuptools.package-data]
laz_engine = ["data/*.json"]
laz_admin = ["data/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["migration/reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
